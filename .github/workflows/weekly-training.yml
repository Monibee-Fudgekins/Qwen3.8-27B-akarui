# Weekly Akarui Training — trigger only (short-poll).
#
# This workflow does NOT train on GitHub-hosted runners and never loads
# the 27B model there. It only STARTS a Kaggle cycle and records it:
#
#   1. Trigger the SFT training kernel (Wed 08:00 UTC, or dispatch) in
#      candidate mode, or the eval kernel in base mode. The trigger
#      submits the kernel and confirms it started (queued/running) --
#      it does NOT wait for completion. A run that waits on Kaggle
#      burns the whole job: the old flow held the runner up to the
#      6h cap and was killed mid-poll, so the promote step never ran.
#   2. Write the cycle state to evaluation/akarui-cycle.json and commit
#      it. The check workflow (.github/workflows/check-training.yml)
#      reads that state every 6h, triggers the eval kernel when
#      training completes, and runs the gate/promote/commit steps when
#      the eval completes.
#
# A weekly-quota refusal records skipped_quota and ends the cycle
# (state phase=idle). No promotion can pass until
# evaluation/baseline_results.json holds a MEASURED base-model score
# (measure it first with a dispatch in 'base' mode).
#
# The manual publish path (.github/workflows/publish-model.yml, with
# its confirm_gates_passed approval) is unchanged and is not used here.

name: Weekly Akarui Training

on:
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "'candidate': train + evaluate + gate + promote. 'base': measure the base model only (no training, no promotion)."
        required: false
        default: "candidate"
        type: choice
        options:
          - candidate
          - base
      force:
        description: "'true': start a new cycle even if the state file says one is active or uncollected."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

# The weekly trigger and the check workflow share one group so they
# never race on the cycle state file. A check that is mid-transition
# delays the weekly dispatch (and vice versa); neither cancels the other.
concurrency:
  group: akarui-training
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger Kaggle cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRAIN_KERNEL: monibeefudgekins/akarui-sft-training
      EVAL_CANDIDATE_KERNEL: monibeefudgekins/akarui-eval-candidate
      EVAL_BASELINE_KERNEL: monibeefudgekins/akarui-eval-baseline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml kaggle kagglehub six

      - name: Configure Kaggle CLI auth
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from kaggle_auth import configure_kaggle_auth; print(configure_kaggle_auth())"
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}

      # Guard: never start a second cycle while one is already active.
      # Reads the committed state; if a cycle is in training/eval and
      # its kernel is still queued/running -- or finished but not yet
      # collected by the check workflow -- this dispatch exits quietly
      # and the active cycle continues under the check workflow.
      # A kernel that errored/cancelled is a dead cycle: proceed with
      # a fresh dispatch. Fails OPEN: a status-call error proceeds
      # with the dispatch instead of blocking the weekly run on a
      # Kaggle API hiccup. `force` bypasses the guard entirely.
      - name: Check for an active cycle
        id: guard
        run: |
          python - <<'EOF'
          import json, os, subprocess
          from pathlib import Path
          active = "false"
          force = "${{ inputs.force || 'false' }}" == "true"
          state_path = Path("evaluation/akarui-cycle.json")
          if not force and state_path.exists():
              try:
                  state = json.loads(state_path.read_text())
              except json.JSONDecodeError:
                  state = {}
              phase = state.get("phase")
              if phase in ("training", "eval"):
                  kernel = state.get("train_kernel") if phase == "training" else state.get("eval_kernel")
                  if kernel:
                      try:
                          out = subprocess.run(["kaggle", "kernels", "status", kernel],
                                               capture_output=True, text=True, timeout=120)
                          text = (out.stdout + out.stderr).lower()
                          if "error" in text or "cancelled" in text:
                              print(f"stale state: phase={phase} kernel={kernel} ended; proceeding with a fresh dispatch")
                          elif "running" in text or "queued" in text or "complete" in text:
                              active = "true"
                              print(f"cycle already active: phase={phase} kernel={kernel}; skipping this dispatch (use force=true to override)")
                          else:
                              print(f"warning: kernel status unparseable ({text.strip()[:200]}); proceeding with the dispatch")
                      except Exception as exc:
                          print(f"warning: could not check kernel status ({exc}); proceeding with the dispatch")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"active={active}\n")
          EOF

      - name: Trigger Kaggle training
        if: ${{ inputs.mode != 'base' && steps.guard.outputs.active != 'true' }}
        run: python scripts/trigger_kaggle.py --run-record output/kaggle-run.json --submit-only
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}

      - name: Check whether training ran
        id: training
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path
          skipped = "false"
          record = Path("output/kaggle-run.json")
          if record.exists():
              status = json.loads(record.read_text()).get("status")
              print(f"training run status: {status}")
              if status == "skipped_quota":
                  skipped = "true"
          else:
              print("no training run record (base mode: no training was triggered)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skipped={skipped}\n")
          EOF

      - name: Package and trigger eval kernel
        if: ${{ inputs.mode == 'base' && steps.training.outputs.skipped != 'true' && steps.guard.outputs.active != 'true' }}
        run: |
          MODE="${{ inputs.mode || 'candidate' }}"
          if [ "$MODE" = "base" ]; then KERNEL="$EVAL_BASELINE_KERNEL"; else KERNEL="$EVAL_CANDIDATE_KERNEL"; fi
          python scripts/package_eval_kernel.py --mode "$MODE" --out kernels/eval
          python scripts/trigger_kaggle.py --notebook-dir kernels/eval --kernel "$KERNEL" --run-record output/kaggle-eval-run.json --submit-only
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}

      - name: Diagnose failed kernel push
        if: ${{ failure() }}
        run: python scripts/diagnose_kernel_push.py --notebook-dir kernels/eval
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}

      # Record the cycle state for the check workflow. Candidate mode:
      # phase=training (the check triggers the eval kernel when training
      # completes). Base mode: phase=eval (the eval kernel was just
      # triggered here). Quota skip: phase=idle. When the guard found an
      # active cycle, this step is skipped so the active state is kept.
      - name: Write cycle state
        id: state
        if: ${{ steps.guard.outputs.active != 'true' }}
        run: |
          python - <<'EOF'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          mode = "${{ inputs.mode || 'candidate' }}"
          skipped = "${{ steps.training.outputs.skipped }}" == "true"
          now = datetime.now(timezone.utc).isoformat()
          if skipped:
              state = {"cycle": now[:10], "mode": mode, "phase": "idle",
                       "reason": "skipped_quota", "dispatched_at": now, "updated_at": now}
          elif mode == "base":
              state = {"cycle": now[:10], "mode": mode, "phase": "eval",
                       "train_kernel": "monibeefudgekins/akarui-sft-training",
                       "eval_kernel": "monibeefudgekins/akarui-eval-baseline",
                       "dispatched_at": now, "updated_at": now}
          else:
              state = {"cycle": now[:10], "mode": mode, "phase": "training",
                       "train_kernel": "monibeefudgekins/akarui-sft-training",
                       "eval_kernel": "monibeefudgekins/akarui-eval-candidate",
                       "dispatched_at": now, "updated_at": now}
          path = Path("evaluation/akarui-cycle.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(state, indent=2) + "\n")
          print(f"cycle state written: phase={state['phase']} mode={mode}")
          EOF

      - name: Commit cycle state
        if: ${{ steps.guard.outputs.active != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluation/akarui-cycle.json
          git diff --cached --quiet || git commit -m "chore: akarui cycle started $(date -u +%Y-%m-%d) (${{ inputs.mode || 'candidate' }})"
          git push
